# Production Docker Compose
# Usage: docker compose up -d
# Access the application at: http://localhost:8000
#
# For development with hot reload, use:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:15-alpine
    container_name: spotihost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 3s
      retries: 3
    networks:
      - spotihost-internal

  app:
    image: nilsgenge/spotihost:latest
    container_name: spotihost-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - SERVE_STATIC=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/temp_imports
    networks:
      - spotihost-internal

volumes:
  postgres_data:
  app_data:

networks:
  spotihost-internal:
    driver: bridge