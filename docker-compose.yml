# Production Docker Compose
# Usage: docker compose up -d
# Access the application at: http://localhost:8000

services:
  db:
    image: postgres:15-alpine
    container_name: spotihost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGPORT: ${DB_PORT:-5432}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -p ${DB_PORT:-5432}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -p ${DB_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spotihost-internal

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - PORT=${PORT:-8000}
    container_name: spotihost-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - SERVE_STATIC=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/temp_imports
    networks:
      - spotihost-internal

volumes:
  postgres_data:
  app_data:

networks:
  spotihost-internal:
    driver: bridge